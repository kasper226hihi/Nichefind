<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NicheFind — Tes résultats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f9f8f6; --bg2:#f2f0ec; --surface:#ffffff;
    --border:#e5e2dc; --border2:#d4d0c8;
    --ink:#1a1917; --ink2:#3d3b37; --muted:#9a9790;
    --accent:#2a5cff; --accent-light:#eef1ff;
    --accent2:#0d9e6e; --accent2-light:#edfaf4;
    --warn:#c44b00; --warn-light:#fff4ee;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; font-size:15px; }

  header {
    position:sticky; top:0; z-index:50;
    padding:0 48px; height:56px;
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(249,248,246,0.95); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .logo { font-size:1.1rem; font-weight:700; letter-spacing:-0.03em; color:var(--ink); text-decoration:none; }
  .logo span { color:var(--accent); }
  .header-r { display:flex; gap:10px; }
  .btn-xs-ghost { border:1.5px solid var(--border); background:none; padding:7px 14px; border-radius:7px; font-size:0.78rem; font-weight:500; color:var(--ink2); text-decoration:none; cursor:pointer; transition:border-color 0.15s; font-family:'Inter',sans-serif; }
  .btn-xs-ghost:hover { border-color:var(--ink); }
  .btn-xs-fill { background:var(--ink); color:#fff; padding:7px 14px; border-radius:7px; font-size:0.78rem; font-weight:600; text-decoration:none; }
  .btn-xs-fill:hover { opacity:0.85; }

  /* HERO */
  .hero { max-width:1100px; margin:0 auto; padding:48px 48px 28px; }
  .hero-top { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:20px; }
  .breadcrumb { font-size:0.75rem; color:var(--muted); margin-bottom:10px; }
  .breadcrumb a { color:var(--muted); text-decoration:none; }
  .breadcrumb a:hover { color:var(--ink); }
  .hero-title { font-size:clamp(1.8rem,3.5vw,2.4rem); font-weight:700; letter-spacing:-0.03em; line-height:1.15; margin-bottom:6px; }
  .hero-title em { font-style:normal; color:var(--accent); }
  .hero-sub { font-size:0.875rem; color:var(--muted); }
  .profile-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; }
  .chip { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:0.75rem; color:var(--ink2); font-weight:500; display:inline-flex; align-items:center; gap:5px; }

  /* AUDIENCE BAR */
  .aud-bar {
    max-width:1100px; margin:0 auto; padding:16px 48px;
    display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--border);
    position:sticky; top:56px; background:rgba(249,248,246,0.97); backdrop-filter:blur(8px); z-index:40;
  }
  .aud-label { font-size:0.7rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
  .aud-btns { display:flex; gap:6px; flex-wrap:wrap; }
  .aud-btn {
    padding:6px 14px; border-radius:7px; border:1.5px solid var(--border);
    background:var(--surface); font-size:0.8rem; font-weight:500; color:var(--muted);
    cursor:pointer; transition:all 0.15s; font-family:'Inter',sans-serif;
  }
  .aud-btn:hover { border-color:var(--ink2); color:var(--ink); }
  .aud-btn.active { background:var(--ink); border-color:var(--ink); color:#fff; font-weight:600; }

  /* NICHES */
  .niches { max-width:1100px; margin:0 auto; padding:28px 48px 80px; }
  .niche-card {
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    margin-bottom:20px; overflow:hidden;
    opacity:0; transform:translateY(20px);
  }
  .niche-card.visible {
    animation:cardIn 0.5s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes cardIn { to { opacity:1; transform:translateY(0); } }

  /* NICHE HEADER */
  .niche-hdr {
    padding:24px 28px 20px;
    display:grid; grid-template-columns:1fr auto; gap:20px; align-items:start;
    border-bottom:1px solid var(--border);
  }
  .niche-rank { font-size:0.68rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .niche-name { font-size:1.25rem; font-weight:700; letter-spacing:-0.025em; margin-bottom:6px; }
  .niche-desc { font-size:0.845rem; color:var(--muted); line-height:1.6; max-width:520px; }

  /* METRICS ROW */
  .metrics-row { display:flex; gap:1px; background:var(--border); border-radius:10px; overflow:hidden; flex-shrink:0; }
  .metric-cell { background:var(--surface); padding:12px 16px; text-align:center; min-width:82px; }
  .metric-val {
    font-size:1.3rem; font-weight:700; letter-spacing:-0.03em; color:var(--ink);
    display:block; min-height:1.6rem;
  }
  .metric-val.up { color:var(--accent2); }
  .metric-lbl { font-size:0.63rem; color:var(--muted); margin-top:2px; font-weight:500; display:block; }
  .metric-bar { height:2px; background:var(--border); border-radius:1px; margin-top:6px; overflow:hidden; }
  .metric-bar-fill { height:100%; background:var(--accent2); width:0; transition:width 1.2s cubic-bezier(.4,0,.2,1); border-radius:1px; }

  /* IDEAS GRID */
  .ideas-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:1px; background:var(--border);
  }
  .idea-cell {
    background:var(--surface); padding:16px 18px; cursor:default;
    transition:background 0.15s;
    opacity:0; transform:translateY(8px);
  }
  .idea-cell.visible {
    animation:ideaIn 0.35s ease forwards;
  }
  @keyframes ideaIn { to { opacity:1; transform:translateY(0); } }
  .idea-cell:hover { background:var(--bg); }
  .idea-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:7px; }
  .idea-title { font-size:0.845rem; font-weight:600; line-height:1.35; color:var(--ink); }
  .badge { flex-shrink:0; font-size:0.62rem; font-weight:700; padding:2px 7px; border-radius:4px; letter-spacing:0.03em; white-space:nowrap; margin-top:1px; }
  .badge-innov { background:var(--warn-light); color:var(--warn); }
  .badge-trend { background:var(--accent2-light); color:var(--accent2); }
  .badge-sure  { background:var(--accent-light); color:var(--accent); }
  .idea-desc { font-size:0.785rem; color:var(--muted); line-height:1.55; }

  /* NICHE FOOTER */
  .niche-ftr {
    padding:10px 20px; background:var(--bg2); border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; font-size:0.75rem; color:var(--muted);
  }
  .trend-pill { color:var(--accent2); font-weight:600; }

  .back-link { display:inline-flex; align-items:center; gap:6px; color:var(--muted); text-decoration:none; font-size:0.83rem; font-weight:500; margin-top:8px; }
  .back-link:hover { color:var(--ink); }

  @keyframes spin { to { transform:rotate(360deg); } }
  @media(max-width:768px) {
    header,.hero,.aud-bar,.niches { padding-left:20px; padding-right:20px; }
    .niche-hdr { grid-template-columns:1fr; }
    .metrics-row { width:100%; }
    .ideas-grid { grid-template-columns:1fr; }
  }
</style>
</head>

  lifestyle:["lifestyle_minimalisme"],

};

// ── CHIPS
const chips = document.getElementById("profile-chips");
[[PLAT_LABEL[platform]||platform,"📱"],[interests.map(i=>INT_LABEL[i]||i).join(", "),"🎯"],[NIV_LABEL[niveau]||niveau,"🎓"],[temps+"h / sem","⏱️"],[OBJ_LABEL[objectif]||objectif,"🏆"]].forEach(([v,i])=>{

// ── COUNTER ANIMATION
function animateCounter(el, targetStr, duration=1400) {
  // parse numeric value from string like "6,2€", "+34%", "4,8%", "—"
  if(!targetStr || targetStr==="—") { el.textContent=targetStr; return; }
  const raw = targetStr.replace(",",".").replace(/[^0-9.+\-]/g,"");
  const num = parseFloat(raw);
  if(isNaN(num)) { el.textContent=targetStr; return; }
  const prefix = targetStr.startsWith("+") ? "+" : "";
  const suffix = targetStr.replace(/[0-9,.\-+]/g,"");
  const start = Date.now();
  const easeOut = t => 1 - Math.pow(1-t, 3);
  function tick() {
    const elapsed = Date.now()-start;
    const progress = Math.min(elapsed/duration, 1);
    const val = num * easeOut(progress);
    const display = Number.isInteger(num) ? Math.round(val) : val.toFixed(1).replace(".",",");
    el.textContent = prefix + display + suffix;
    if(progress < 1) requestAnimationFrame(tick);
    else el.textContent = targetStr;
  }
  requestAnimationFrame(tick);
}

// ── METRIC BAR ANIMATION
function animateBar(bar, trendNum, maxTrend=60) {
  const pct = Math.min((trendNum/maxTrend)*100, 100);
  setTimeout(()=>{ bar.style.width = pct+"%"; }, 100);
}

// ── GET NICHES
function getNiches() {
  const ids=[];
  interests.forEach(int=>{ (INTEREST_NICHES[int]||[]).forEach(id=>{ if(!ids.includes(id)) ids.push(id); }); });
  return ids.length ? ids.slice(0,3) : ["food_degustations","food_rapide","food_street"];
}

// ── YOUTUBE API : récupère les vraies stats pour une niche
async function fetchYouTubeStats(nicheName) {
  try {
    const res = await fetch(`/api/youtube?niche=${encodeURIComponent(nicheName)}`);
    const data = await res.json();
    if(!data.items || data.items.length === 0) return null;

    // Calculer les vraies métriques depuis les résultats
    const items = data.items;
    // Nombre de vues total des top vidéos = indicateur de volume
    const totalResults = data.pageInfo?.totalResults || 0;
    const volLabel = totalResults > 500000 ? "Très élevé" : totalResults > 100000 ? "Élevé" : totalResults > 50000 ? "Fort" : "Moyen";

    return { totalResults, volLabel, itemCount: items.length };
  } catch(e) {
    return null;
  }
}

// ── RENDER
async function render() {
  const root = document.getElementById("niches-root");
  root.innerHTML="";
  const ids = getNiches();
  const ranks = ["#1 — Meilleure niche","#2 — Seconde niche","#3 — Troisième niche"];

  // Fetch YouTube stats en parallèle pour toutes les niches
  const ytStats = await Promise.all(
    ids.map(id => NICHE_DB[id] ? fetchYouTubeStats(NICHE_DB[id].name) : Promise.resolve(null))
  );

  ids.forEach((id,i) => {
    const n = NICHE_DB[id]; if(!n) return;
    const m = n.metrics[platform] || n.metrics.indecis || {};
    const ideas = n.ideas[audience] || n.ideas.etudiants || [];

    // Injecter les vraies données YouTube si dispo
    const yt = ytStats[i];
    if(yt) {
      m.vol = yt.volLabel;
      // Ajuster légèrement le trend si on a des données réelles
      if(yt.totalResults > 500000) m.trendNum = Math.max(m.trendNum || 0, 30);
    }

    // Build card
    const card = document.createElement("div");
    card.className="niche-card";
    card.innerHTML = `
      <div class="niche-hdr">
        <div>
          <div class="niche-rank">${ranks[i]}</div>
          <div class="niche-name">${n.name}</div>
          <div class="niche-desc">${n.desc}</div>
        </div>
        <div class="metrics-row">
          ${m.rpm && m.rpm!=="—" ? `<div class="metric-cell"><span class="metric-val" data-target="${m.rpm}" data-duration="1200">—</span><span class="metric-lbl">${platform==="youtube"||platform==="indecis"?"RPM estimé":"—"}</span><div class="metric-bar"><div class="metric-bar-fill"></div></div></span></div>` : ""}
          <div class="metric-cell">
            <span class="metric-val up" data-target="${m.trend}" data-duration="1000">+0%</span>
            <span class="metric-lbl">Tendance 12 mois</span>
            <div class="metric-bar"><div class="metric-bar-fill" data-trend="${m.trendNum||0}"></div></div>
          </div>
          <div class="metric-cell">
            <span class="metric-val" data-target="${m.eng}" data-duration="1300">${m.eng==="—"?"—":"0%"}</span>
            <span class="metric-lbl">Engagement moyen</span>
            <div class="metric-bar"><div class="metric-bar-fill" data-trend="${m.engNum||0}" data-max="120"></div></div>
          </div>
          <div class="metric-cell">
            <span class="metric-val" style="font-size:0.95rem">${m.vol||"—"}</span>
            <span class="metric-lbl">Volume potentiel</span>
          </div>
        </div>
      </div>
      <div class="ideas-grid">
        ${ideas.map((idea,j)=>`
          <div class="idea-cell" style="animation-delay:${j*0.06+0.3}s">
            <div class="idea-top">
              <div class="idea-title">${idea.title}</div>
              <span class="badge ${BADGE_CLS[idea.badge]||"badge-sure"}">${BADGE_LABEL[idea.badge]||""}</span>
            </div>
            <div class="idea-desc">${idea.desc}</div>
          </div>
        `).join("")}
      </div>
      <div class="niche-ftr">
        <span>${ideas.length} idées pour ${AUDIENCES.find(a=>a.id===audience)?.label||audience}</span>
        <span class="trend-pill">↑ ${m.trend} de croissance · ${yt ? yt.totalResults.toLocaleString("fr-FR")+" vidéos" : "live"}</span>
      </div>
    `;
    root.appendChild(card);

    // Intersection observer to trigger animations when visible
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(!entry.isIntersecting) return;
        observer.disconnect();
        // Card enter
        card.classList.add("visible");

        // Animate metric values
        setTimeout(()=>{
          card.querySelectorAll(".metric-val[data-target]").forEach(el=>{
            animateCounter(el, el.dataset.target, parseInt(el.dataset.duration)||1200);
          });
          // Animate bars
          card.querySelectorAll(".metric-bar-fill[data-trend]").forEach(bar=>{
            const max = parseInt(bar.dataset.max)||60;
            animateBar(bar, parseFloat(bar.dataset.trend)||0, max);
          });
        }, 200);

        // Stagger idea cells
        card.querySelectorAll(".idea-cell").forEach((cell,j)=>{
          setTimeout(()=>cell.classList.add("visible"), 350 + j*70);
        });
      });
    }, { threshold: 0.1 });

    observer.observe(card);
  });

  const back = document.createElement("a");
  back.href="questionnaire"; back.className="back-link"; back.textContent="← Refaire l'analyse";
  document.getElementById("loading-state").style.display="none";
  root.appendChild(back);
}

render();
</script>
